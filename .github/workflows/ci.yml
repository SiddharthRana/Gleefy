name: CI

# Branches (same as Weblume): dev is the default branch that pull requests target; main is what's
# released. Pushes to dev and main and every pull request run the checks.
# - dev deploys the "warmup" test copy (warmup.gleefy.party, warmup-api.gleefy.party) straight away,
#   with its settings in the GitHub environment `warmup`.
# - main offers three production deploys; each waits for approval in its GitHub environment
#   ("Review deployments" on the run page).
# Setup: docs/deployment.md.
on:
  # Feature branches are checked through their pull request; pushing to them as well ran everything twice.
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  # Pull request builds cancel older ones. Builds of main and dev never cancel each other, so a deploy
  # is never cut off half way and a build waiting for approval doesn't hold up the next one.
  group: ci-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.sha || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (web, api, packages, content)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Enables the database-backed API e2e tests (apps/api/test/billing/billing.e2e.test.ts).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gleefy_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" run build
      - run: pnpm format:check
      - name: Content is valid and the app's copy is in sync
        run: pnpm content:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Create test database
        run: bash scripts/db-test-setup.sh
      - run: pnpm test
      - name: Build API and web
        run: pnpm --filter @gleefy/api --filter @gleefy/web run build
      - name: Install Playwright browser
        run: pnpm --filter @gleefy/web exec playwright install --with-deps chromium
      # Same site, built with a fake Supabase address so tests can sign in with a seeded session.
      - name: Build web for end-to-end tests
        run: pnpm --filter @gleefy/web run build:e2e
      - name: Web end-to-end and accessibility tests
        run: pnpm --filter @gleefy/web run test:e2e
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high

  database:
    name: Database migrations + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and run RLS tests
        env:
          DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/db-verify.sh

  flutter:
    name: Flutter (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart' ! -name 'app_localizations*')
      - run: flutter analyze
      # Includes the shared engine test vectors in packages/game-engine/test-vectors.
      - run: flutter test
      # The Android build isn't run here to save build minutes: run scripts/android-build.sh on a Mac
      # before merging. It moves back to CI once release signing for Google Play testing is set up.

  api-image:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the image Fly.io deploys
        run: docker build -f apps/api/Dockerfile -t gleefy-api:ci .

  # ---------------------------------------------------------------------------------------------
  # Deploys, after every check passes:
  # - main → production, each behind its environment's required reviewers. A target stays switched
  #   off until its repository variable (DEPLOY_BACKEND / DEPLOY_WEB / DEPLOY_ANDROID) is "true".
  # - dev → warmup (backend and website, no approval), switched on by DEPLOY_WARMUP = "true". The
  #   `warmup` environment overrides the shared variables (SITE_URL, API_URL, SUPABASE_*, FLY_APP…).
  # Nothing runs before its accounts and secrets exist.
  # ---------------------------------------------------------------------------------------------

  deploy-backend:
    name: Deploy backend (${{ github.ref == 'refs/heads/dev' && 'warmup' || 'production' }})
    needs: [typescript, database, flutter, api-image]
    if: >-
      github.event_name == 'push' && (
        (github.ref == 'refs/heads/main' && vars.DEPLOY_BACKEND == 'true') ||
        (github.ref == 'refs/heads/dev' && vars.DEPLOY_WARMUP == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/dev' && 'warmup' || 'backend' }}
      url: ${{ vars.API_URL }}
    concurrency:
      group: deploy-backend-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Migrations first: each one must work with the API version already running.
      - name: Apply database migrations to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy the API to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP || (github.ref == 'refs/heads/dev' && 'gleefy-warmup-api' || 'gleefy-api') }}
          FLY_CONFIG: ${{ github.ref == 'refs/heads/dev' && 'apps/api/fly.warmup.toml' || 'apps/api/fly.toml' }}
        run: >-
          flyctl deploy --remote-only --config "$FLY_CONFIG" --dockerfile apps/api/Dockerfile
          --app "$FLY_APP" --wait-timeout 300
      - name: Smoke test
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$API_URL/ready"
          curl -fsS "$API_URL/v1/billing/config"

  deploy-web:
    name: Deploy website (${{ github.ref == 'refs/heads/dev' && 'warmup' || 'production' }})
    needs: [typescript, database, flutter, api-image]
    if: >-
      github.event_name == 'push' && (
        (github.ref == 'refs/heads/main' && vars.DEPLOY_WEB == 'true') ||
        (github.ref == 'refs/heads/dev' && vars.DEPLOY_WARMUP == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/dev' && 'warmup' || 'web' }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-web-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" run build
      # NEXT_PUBLIC_* values are baked into the static files at build time; all of them are public.
      - name: Build the static site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: ${{ vars.AUTH_GOOGLE_ENABLED }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # The warmup copy is hidden from search engines and labelled as a test site.
          NEXT_PUBLIC_WARMUP: ${{ github.ref == 'refs/heads/dev' && 'true' || 'false' }}
        run: pnpm --filter @gleefy/web build
      # Deploying to the project's production branch makes this the live site.
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || (github.ref == 'refs/heads/dev' && 'gleefy-warmup' || 'gleefy') }}
          WRANGLER_SEND_METRICS: 'false'
        run: >-
          pnpm --filter @gleefy/web exec wrangler pages deploy out
          --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"

  deploy-android:
    name: Release Android app (Google Play)
    needs: [typescript, database, flutter, api-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ANDROID == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: play-store
    concurrency:
      group: deploy-android
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - run: flutter pub get
      # The workflow run number is the Play version code, so every release is higher than the last.
      - name: Build the signed app bundle
        env:
          API_URL: ${{ vars.API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          AUTH_GOOGLE_ENABLED: ${{ vars.AUTH_GOOGLE_ENABLED || 'false' }}
          # Optional, opt-in analytics; empty = the setting isn't offered.
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: >-
          flutter build appbundle --release --build-number=${{ github.run_number }}
          --dart-define=API_BASE_URL="$API_URL" --dart-define=SITE_URL="$SITE_URL"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=AUTH_GOOGLE_ENABLED="$AUTH_GOOGLE_ENABLED"
          --dart-define=POSTHOG_KEY="$POSTHOG_KEY" --dart-define=POSTHOG_HOST="$POSTHOG_HOST"
          --dart-define=APP_VERSION="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gleefy.app
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          # internal → closed → production; promote in Play Console or change the variable.
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - name: Remove the upload key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
